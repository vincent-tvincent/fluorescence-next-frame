[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluorescence-next-frame"
version = "0.1.0"
description = "Predict the next raw fluorescence frame from a variable-length microscopy time series."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "tifffile>=2023.7.10", "torch>=2.5"]

[project.scripts]
fluoroframe = "fluoroframe.cli:main"

[tool.setuptools]
packages = ["fluoroframe"]
